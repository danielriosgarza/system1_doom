[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "system1-doom"
version = "0.4.0"
description = "A ViZDoom agent whose every decision is made by Liquid AI d1-ultra instances: five senses and a central chooser, with bounded evidence, value networks as evidence, and asynchronous macro proposals"
readme = "docs/spec.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26.0",
    "pillow>=10.0.0",
    "pydantic>=2.6.0",
    "requests>=2.31.0",
    "vizdoom>=1.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "jsonschema>=4.0",
]
learn = [
    "torch>=2.2",
    "matplotlib>=3.8",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
markers = ["live: calls the real decision API, d1-ultra with LIQUID_API_KEY or Jev with TYPESAFE_API_KEY (skipped without the key; CI runs -k 'not live')"]
