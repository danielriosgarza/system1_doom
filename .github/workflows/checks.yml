# The web app's lint, format, unit and browser tests, and the Python suite without the live d1-ultra
# test, which needs LIQUID_API_KEY and runs locally.
name: Checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx prettier --check src e2e
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      # CI is set, so Playwright starts its own servers (playwright.config.ts).
      - run: npm run e2e

  python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pyproject.toml
      # torch from the CPU wheel index first, so the learn extra does not pull the CUDA build.
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e ".[dev,learn]"
      - run: python -m pytest -k "not live"
